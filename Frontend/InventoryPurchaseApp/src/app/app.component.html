<mat-toolbar color="primary" class="mat-elevation-z4">
  <button mat-icon-button (click)="drawer.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Inventory Purchase System</span>
  <span class="spacer"></span>
</mat-toolbar>

<mat-drawer-container class="app-container" autosize>
  <mat-drawer #drawer mode="side" opened="true" class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/purchases" routerLinkActive="active-link">
        <mat-icon matListItemIcon>shopping_cart</mat-icon>
        <span matListItemTitle>Purchases</span>
      </a>
      <a mat-list-item routerLink="/inventory" routerLinkActive="active-link">
        <mat-icon matListItemIcon>inventory</mat-icon>
        <span matListItemTitle>Inventory</span>
      </a>
      <a mat-list-item routerLink="/products" routerLinkActive="active-link">
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Products</span>
      </a>
      <a mat-list-item routerLink="/taxes" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt</mat-icon>
        <span matListItemTitle>Taxes</span>
      </a>
      <a mat-list-item routerLink="/suppliers" routerLinkActive="active-link">
        <mat-icon matListItemIcon>local_shipping</mat-icon>
        <span matListItemTitle>Suppliers</span>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <div class="content-area">
    <router-outlet></router-outlet>
  </div>
</mat-drawer-container>
