<div class="container">
  <div class="header">
    <h2>Suppliers</h2>
    <button mat-raised-button color="primary" (click)="openDialog()">Add Supplier</button>
  </div>

  <table mat-table [dataSource]="suppliers" class="mat-elevation-z8">
    <ng-container matColumnDef="supplierName">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let supplier"> {{supplier.supplierName}} </td>
    </ng-container>

    <ng-container matColumnDef="contactInfo">
      <th mat-header-cell *matHeaderCellDef> Contact Info </th>
      <td mat-cell *matCellDef="let supplier"> {{supplier.contactInfo}} </td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef> Active </th>
      <td mat-cell *matCellDef="let supplier"> {{supplier.isActive ? 'Yes' : 'No'}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let supplier">
        <button mat-button color="primary" (click)="openDialog(supplier)">Edit</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
