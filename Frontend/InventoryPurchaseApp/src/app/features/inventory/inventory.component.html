<div class="container">
  <div class="header">
    <h1>Inventory</h1>
    <mat-slide-toggle [(ngModel)]="hideExpired" (change)="onFilterChange()">Hide Expired</mat-slide-toggle>
  </div>

  <table mat-table [dataSource]="inventory" class="mat-elevation-z8">
    <ng-container matColumnDef="productName">
      <th mat-header-cell *matHeaderCellDef> Product </th>
      <td mat-cell *matCellDef="let element"> {{element.productName}} </td>
    </ng-container>

    <ng-container matColumnDef="lotNumber">
      <th mat-header-cell *matHeaderCellDef> Lot Number </th>
      <td mat-cell *matCellDef="let element"> {{element.lotNumber || 'N/A'}} </td>
    </ng-container>

    <ng-container matColumnDef="expiryDate">
      <th mat-header-cell *matHeaderCellDef> Expiry Date </th>
      <td mat-cell *matCellDef="let element"> {{element.expiryDate ? (element.expiryDate | date) : 'N/A'}} </td>
    </ng-container>

    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef> Quantity </th>
      <td mat-cell *matCellDef="let element"> {{element.quantity}} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element"> 
        <span [ngClass]="{'expired': element.isExpired, 'valid': !element.isExpired}">
          {{element.isExpired ? 'Expired' : 'Valid'}}
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" [ngClass]="{'expired-row': row.isExpired}"></tr>
  </table>
</div>
